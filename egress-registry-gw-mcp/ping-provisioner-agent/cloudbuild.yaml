# Cloud Build pipeline: ping-provisioner-agent
#
# Deploys the ADK Python provisioner agent. This service receives provisioning
# instructions via POST /provision, creates an ADK LlmAgent backed by two
# MCPToolsets (PingOne AIC + Entra), and calls the backend MCP servers.
#
# The Agent Gateway (ping-authz-agent-gateway) and authz policy are registered
# in GCP Agent Registry. When google-adk[agent-identity] is GA, swap
# PINGONE_AIC_MCP_URL / ENTRA_MCP_URL back to AGENT_GATEWAY_URL and use
# AgentRegistry.get_mcp_toolset() in agent.py.
#
# Pipeline: Build image → Push to Artifact Registry → Deploy to Cloud Run
#           → Register agent in GCP Agent Registry

substitutions:
  _GCP_REGION: us-central1
  _GCP_PROJECT_ID: tech-partner-ping
  _PROVISIONER_REPO: ping-provisioner-repo
  _SERVICE_NAME: gw-ping-provisioner-agent
  _IMAGE_TAG: latest
  _AGENT_PORT: "3000"
  _GEMINI_MODEL: gemini-2.5-flash
  _GOOGLE_CLOUD_LOCATION: us-central1
  _PINGONE_AIC_MCP_URL: https://gw-pingone-aic-mcp-uu2pkgxfka-uc.a.run.app/mcp
  _ENTRA_MCP_URL: https://gw-entra-mcp-uu2pkgxfka-uc.a.run.app/mcp

steps:
  # Build the Docker image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PROVISIONER_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - egress-registry-gw-mcp/ping-provisioner-agent

  # Push the image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PROVISIONER_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}

  # Deploy to Cloud Run.
  # --ingress: internal — only callable by Agent Runtime / Agent Registry, not the public internet.
  # --no-allow-unauthenticated: requires a valid Google-signed OIDC token (Cloud Run invoker role).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PROVISIONER_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --region
      - ${_GCP_REGION}
      - --platform
      - managed
      - --ingress
      - internal
      - --no-allow-unauthenticated
      - --port
      - ${_AGENT_PORT}
      - --set-env-vars
      - GOOGLE_CLOUD_PROJECT=${_GCP_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION},AGENT_PORT=${_AGENT_PORT},GEMINI_MODEL=${_GEMINI_MODEL},PINGONE_AIC_MCP_URL=${_PINGONE_AIC_MCP_URL},ENTRA_MCP_URL=${_ENTRA_MCP_URL}
      - --update-secrets
      - GOOGLE_API_KEY=gemini-api-key:latest

  # Register the agent in GCP Agent Registry so it appears in the console
  # and can be discovered by other agents.  The create-or-update pattern
  # makes this step safe to re-run on every deploy.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_GCP_REGION} --project=${_GCP_PROJECT_ID} \
          --format='value(status.url)')
        echo "Registering ${_SERVICE_NAME} at $$SERVICE_URL"
        gcloud alpha agent-registry services create ${_SERVICE_NAME} \
          --project=${_GCP_PROJECT_ID} \
          --location=${_GCP_REGION} \
          --display-name="Ping Provisioner Agent" \
          --agent-spec-type=no-spec \
          --interfaces="url=$$SERVICE_URL,protocolBinding=HTTP_JSON" \
        || gcloud alpha agent-registry services update ${_SERVICE_NAME} \
             --project=${_GCP_PROJECT_ID} \
             --location=${_GCP_REGION} \
             --interfaces="url=$$SERVICE_URL,protocolBinding=HTTP_JSON"

options:
  logging: CLOUD_LOGGING_ONLY
