# Cloud Build pipeline: pingone-aic-mcp
#
# Deploys the PingOne AIC MCP server. This service wraps the ForgeRock Identity
# Cloud (AIC) Management REST API and exposes it as an MCP server on /mcp.
# After deploy it registers the service in GCP Agent Registry so the Agent
# Gateway can route to it and so it appears in the console.
#
# Pipeline: Build image → Push to Artifact Registry → Deploy to Cloud Run
#           → Register MCP server in GCP Agent Registry

substitutions:
  _GCP_REGION: us-central1
  _GCP_PROJECT_ID: tech-partner-ping
  _PINGONE_AIC_MCP_REPO: pingone-aic-mcp-repo
  _SERVICE_NAME: gw-pingone-aic-mcp
  _REGISTRY_SERVICE_NAME: pingone-aic-mcp-server
  _IMAGE_TAG: latest
  _AIC_BASE_URL: https://openam-tntp-aiagents.forgeblocks.com
  _AIC_REALM: alpha
  _MCP_REQUIRED_SCOPES: "pingone:provisioning"

steps:
  # Build the Docker image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PINGONE_AIC_MCP_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - egress-registry-gw-mcp/pingone-aic-mcp

  # Push the image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PINGONE_AIC_MCP_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}

  # Deploy to Cloud Run.
  # --ingress: internal — only reachable via the Agent Gateway.
  # AIC admin credentials are stored in Secret Manager.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PINGONE_AIC_MCP_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --region
      - ${_GCP_REGION}
      - --platform
      - managed
      - --ingress
      - internal
      - --no-allow-unauthenticated
      - --set-env-vars
      - MCP_SERVER_PORT=8080,AIC_BASE_URL=${_AIC_BASE_URL},AIC_REALM=${_AIC_REALM},MCP_REQUIRED_SCOPES=${_MCP_REQUIRED_SCOPES}
      - --update-secrets
      - AIC_ADMIN_CLIENT_ID=aic-admin-client-id:latest,AIC_ADMIN_CLIENT_SECRET=aic-admin-client-secret:latest

  # Register the MCP server in GCP Agent Registry with its tool definitions.
  # The toolspec file tells Agent Registry what tools the server exposes so
  # they appear in the console and can be discovered by registered agents.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_GCP_REGION} --project=${_GCP_PROJECT_ID} \
          --format='value(status.url)')
        echo "Registering ${_REGISTRY_SERVICE_NAME} at $$SERVICE_URL"
        gcloud alpha agent-registry services create ${_REGISTRY_SERVICE_NAME} \
          --project=${_GCP_PROJECT_ID} \
          --location=${_GCP_REGION} \
          --display-name="PingOne AIC Provisioner MCP Server" \
          --mcp-server-spec-type=tool-spec \
          --mcp-server-spec-content=egress-registry-gw-mcp/pingone-aic-mcp/toolspec.json \
          --interfaces="url=$$SERVICE_URL,protocolBinding=JSONRPC" \
        || gcloud alpha agent-registry services update ${_REGISTRY_SERVICE_NAME} \
             --project=${_GCP_PROJECT_ID} \
             --location=${_GCP_REGION} \
             --mcp-server-spec-content=egress-registry-gw-mcp/pingone-aic-mcp/toolspec.json \
             --interfaces="url=$$SERVICE_URL,protocolBinding=JSONRPC"

options:
  logging: CLOUD_LOGGING_ONLY
